<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CF Grind Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container" id="mainView" style="display: none;">
    <div class="header">
      <div class="rank-badge" id="avatarBadge"></div>
      <div class="user-info">
        <h2 id="handleDisplay">Loading...</h2>
      </div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Solves Today</div>
        <div class="stat-value" id="solvesTodayDisplay">0</div>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn btn-primary" id="btnDashboard">Open Dashboard</button>
      <button class="btn btn-secondary" id="btnSettings">Settings</button>
    </div>
  </div>

  <div class="container setup-container" id="setupView" style="display: none;">
    <h2>Welcome to CF Grind Tracker</h2>
    <p>Enter your Codeforces handle to begin.</p>
    <div class="input-group">
      <input type="text" id="handleInput" placeholder="Codeforces Handle">
    </div>
    <button class="btn btn-primary" id="btnSaveSetup">Start Grinding</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
