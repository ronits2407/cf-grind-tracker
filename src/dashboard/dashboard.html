<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CF Grind Tracker | Dashboard</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Chart.js -->
  <script src="../lib/chart.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/charts.css">
  <link rel="stylesheet" href="styles/heatmap.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="logo">CFGT</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="#overview" class="nav-item active" data-page="overview">
          <span class="icon">📊</span> Overview
        </a>
        <a href="#mode-stats" class="nav-item" data-page="mode-stats">
          <span class="icon">🎯</span> Mode Stats
        </a>
        <a href="#rating-breakdown" class="nav-item" data-page="rating-breakdown">
          <span class="icon">📈</span> Rating Breakdown
        </a>
        <a href="#problem-history" class="nav-item" data-page="problem-history">
          <span class="icon">📜</span> Problem History
        </a>
        <a href="#friends" class="nav-item" data-page="friends">
          <span class="icon">👥</span> Friends
        </a>
        <a href="#settings" class="nav-item" data-page="settings">
          <span class="icon">⚙️</span> Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="rank-preview">
          <div class="rank-badge" id="sidebar-rank-icon">S1</div>
          <div class="rank-details">
            <div class="rank-name" id="sidebar-rank-name">SILVER 1</div>
            <div class="rank-rating" id="sidebar-rating">1200 RR</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Pages will be injected here -->
    </main>
  </div>

  <!-- Main App Script -->
  <script type="module" src="dashboard.js"></script>
</body>
</html>
