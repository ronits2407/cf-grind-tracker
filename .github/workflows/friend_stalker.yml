name: Friend Stalker Bot

on:
  workflow_dispatch:

concurrency:
  group: friend-stalker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stalk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Friend Stalker Script
        env:
          NTFY_TOPIC: 'cf-grind-gzn84omyxtxx'
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN || 'tk_lgbthqe3ldnhpln6blr2ho56qpc0b' }}
        run: node scripts/friend_stalker.mjs

      - name: Commit state changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update friend stalker state [skip ci]"
          file_pattern: "scripts/state.json"
